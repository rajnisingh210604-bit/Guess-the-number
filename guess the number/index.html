<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess the Number</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>🎯 Guess the Number</h1>
    <p class="subtitle">Pick a number between <strong>1 and 100</strong></p>

    <div class="attempts-left">Attempts left: <span id="attempts-left">7</span></div>

    <div class="input-row">
      <input type="number" id="guess-input" placeholder="Enter your guess" min="1" max="100" />
      <button id="btn-guess" onclick="makeGuess()">Guess</button>
    </div>

    <div id="feedback" class="feedback"></div>

    <div class="history">
      <p class="history-title">Your guesses:</p>
      <div id="chips"></div>
    </div>

    <button id="btn-new" onclick="newGame()">🔄 New Game</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
